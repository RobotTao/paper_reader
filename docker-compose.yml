services:
  paper-reader:
    build:
      context: .
      dockerfile: Dockerfile
    image: paper-reader:latest
    container_name: paper-reader
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PDF_ROOT: /data
      DATA_DIR: /data/db
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-200}"
    volumes:
      # Everything lives under ./local_data: the PDF store, the readpaper
      # export and the SQLite database. The store is writable, so the app
      # can add and remove PDFs inside it.
      - ./local_data:/data
      - ./local_data/data.json:/data/data.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/healthz').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
